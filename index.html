<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pergaminho</title>
<meta name="theme-color" content="#0F1B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pergaminho">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Josefin+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="supabase.min.js"></script>
<script src="jspdf.umd.min.js" defer></script>
<style>
:root{
  --azul:#0F1B33; --ouro:#C9A227;
  --fundo:#E9E3D6; --barra:#0F1B33; --barra2:#16233F; --barra-tx:#F4EBD3; --barra-sub:#A9B2C6;
  --painel:#FFFDF6; --tx:#1B2438; --sub:#6B6658; --borda:#E1DACB; --bt:#22314F;
  --sombra:0 10px 30px rgba(15,27,51,.18);
}
[data-tema="escuro"]{
  --fundo:#0A111F; --barra:#060C18; --barra2:#0E1729; --painel:#17223A; --tx:#E9E4D6; --sub:#A7A08F; --borda:#2B3A57;
  --sombra:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--fundo);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.oculto{display:none!important}
#app{display:flex;flex-direction:column;height:100dvh}

/* ---------- barras ---------- */
.barra{background:var(--barra);color:var(--barra-tx);padding-top:env(safe-area-inset-top,0px);flex:none;z-index:5}
.b1{display:flex;align-items:center;gap:6px;padding:6px 10px;height:50px}
.b2{display:flex;align-items:center;gap:4px;padding:5px 10px 7px;background:var(--barra2);overflow-x:auto;scrollbar-width:none}
.b2::-webkit-scrollbar{display:none}
.bt{background:transparent;border:none;border-radius:10px;height:38px;min-width:38px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--barra-tx);flex:none}
.bt svg{width:21px;height:21px}
.bt:active{background:rgba(255,255,255,.12)}
.bt.on{background:var(--ouro);color:var(--azul)}
.bt .rot{font-size:13px;font-weight:600}
.titulo{flex:1;min-width:0;text-align:center;line-height:1.1}
.titulo b{display:block;font-family:Cinzel,Georgia,serif;font-size:16px;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titulo small{font-size:11.5px;color:var(--barra-sub)}
.num{font-size:13px;color:var(--barra-sub);min-width:46px;text-align:center;flex:none}
.versao{font-size:11px;color:var(--barra-sub);flex:none;padding:0 2px}
.sync{width:11px;height:11px;border-radius:50%;background:#7C8597;flex:none;margin:0 6px;border:none;padding:0}
.sync.ok{background:#3FB56A}.sync.pend{background:var(--ouro)}.sync.erro{background:#E5484D}
.sep{width:1px;height:24px;background:rgba(255,255,255,.18);margin:0 5px;flex:none}
.cor{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.25);flex:none;margin:0 2px;padding:0}
.cor.on{border-color:#fff;box-shadow:0 0 0 2px var(--ouro)}
.gr i{display:block;border-radius:50%;background:currentColor}

/* ---------- palco e folha ---------- */
.palco{flex:1;position:relative;overflow:hidden;touch-action:none}
.folha{position:absolute;background:#fff;border-radius:3px;box-shadow:0 4px 18px rgba(0,0,0,.16);overflow:hidden}
.folha canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.camada{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.txw{position:absolute}
.tx{white-space:pre-wrap;word-wrap:break-word;line-height:1.32;outline:none;min-height:1.32em;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;pointer-events:none}
.mover{position:absolute;left:-26px;top:-2px;width:24px;height:24px;border-radius:7px;border:none;background:var(--ouro);color:var(--azul);display:none;pointer-events:auto;padding:3px;touch-action:none}
.mover svg{width:18px;height:18px}
.modo-texto .tx{pointer-events:auto;-webkit-user-select:text;user-select:text;outline:1px dashed rgba(201,162,39,.85);outline-offset:3px;cursor:text}
.modo-texto .mover{display:block}
.figw{position:absolute;display:none;outline:2px dashed var(--ouro);outline-offset:0;pointer-events:auto;touch-action:none;cursor:move;background:rgba(201,162,39,.06)}
.modo-figura .figw{display:block}
.figApagar{position:absolute;right:-14px;top:-14px;width:28px;height:28px;border-radius:50%;background:#C0392B;color:#fff;font-size:20px;line-height:27px;text-align:center;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.figTam{position:absolute;right:-12px;bottom:-12px;width:26px;height:26px;border-radius:7px;background:var(--ouro);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:nwse-resize}
#menuFormas{position:fixed;z-index:60;background:var(--painel);color:var(--tx);border:1px solid var(--borda);border-radius:14px;box-shadow:var(--sombra);padding:6px;display:flex;flex-direction:column;min-width:190px}
#menuFormas button{display:flex;align-items:center;gap:12px;border:none;background:transparent;border-radius:9px;padding:9px 10px;font-size:15px;color:var(--tx);text-align:left}
#menuFormas button svg{width:22px;height:22px}
#menuFormas button.on{background:var(--ouro);color:var(--azul)}
.abas{position:absolute;display:flex;flex-direction:column;gap:3px;z-index:2}
.aba{width:30px;border:none;border-radius:0 9px 9px 0;padding:6px 0;writing-mode:vertical-rl;font-size:11px;font-weight:600;letter-spacing:.3px;
  color:rgba(0,0,0,.55);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-shadow:2px 1px 4px rgba(0,0,0,.08);transition:width .15s}
.aba.ativa{width:40px;color:rgba(0,0,0,.75)}

/* ---------- painéis ---------- */
.veu{position:fixed;inset:0;background:rgba(6,12,24,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.cartao{background:var(--painel);color:var(--tx);width:100%;max-width:720px;max-height:86dvh;overflow:auto;border-radius:20px 20px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--sombra)}
@media (min-width:700px){.veu{align-items:center}.cartao{border-radius:20px}}
.cartao h2{font-family:Cinzel,Georgia,serif;font-size:18px;margin:0 0 4px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cartao h3{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--sub);margin:18px 0 8px}
.cartao p{color:var(--sub);font-size:14px;margin:4px 0}
.fechar{background:transparent;border:none;font-size:26px;line-height:1;color:var(--sub);padding:0 4px}
.botao{border:1px solid var(--borda);background:transparent;border-radius:11px;padding:10px 14px;font-size:14px;font-weight:600;color:var(--tx)}
.botao.forte{background:var(--azul);color:#fff;border-color:var(--azul)}
[data-tema="escuro"] .botao.forte{background:var(--ouro);color:var(--azul);border-color:var(--ouro)}
.botao.perigo{color:#C0392B;border-color:#E8B4AC}
.botao.armado{background:#C0392B;color:#fff;border-color:#C0392B}
.linha{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--borda);font-size:15px}
.linha:last-child{border-bottom:none}
.campo{width:100%;border:1px solid var(--borda);border-radius:11px;padding:12px;font-size:16px;background:#fff;color:#1B2438;-webkit-user-select:text;user-select:text}
.campo:focus{outline:2px solid var(--ouro);border-color:var(--ouro)}
.cores{display:flex;gap:10px;flex-wrap:wrap}
.cores button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;padding:0}
.cores button.on{border-color:var(--azul);box-shadow:0 0 0 2px var(--ouro)}
.modelos{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:520px){.modelos{grid-template-columns:repeat(2,1fr)}}
.modelo{border:2px solid var(--borda);border-radius:12px;background:transparent;padding:8px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;font-weight:600}
.modelo canvas{width:100%;aspect-ratio:3/4;border-radius:4px;box-shadow:0 1px 5px rgba(0,0,0,.15);background:#fff}
.modelo.on{border-color:var(--ouro)}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.mini{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.mini canvas{width:100%;aspect-ratio:3/4;border-radius:4px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.18);border:2px solid transparent}
.mini.atual canvas{border-color:var(--ouro)}
.mini .acoes{display:flex;justify-content:space-between}
.mini .acoes button{border:1px solid var(--borda);background:transparent;border-radius:8px;width:30px;height:28px;padding:0;font-size:14px}
.mini .acoes button.armado{background:#C0392B;color:#fff;border-color:#C0392B}
.mini small{font-size:11.5px;color:var(--sub);text-align:center}
.abaLinha{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--borda)}
.abaLinha i{width:22px;height:22px;border-radius:6px;flex:none}
.abaLinha span{flex:1;font-size:15px}
.abaLinha button{border:1px solid var(--borda);background:transparent;border-radius:8px;min-width:34px;height:32px;font-size:14px}

/* ---------- estante ---------- */
#estante{position:fixed;inset:0;z-index:40;background:var(--fundo);display:flex;flex-direction:column}
#estante .eb{background:var(--barra);color:var(--barra-tx);padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 10px;display:flex;align-items:center;gap:8px}
#estante .eb h1{flex:1;margin:0;font-family:Cinzel,Georgia,serif;font-size:20px;letter-spacing:.5px}
#estante .eb small{display:block;font-family:Georgia,serif;font-style:italic;font-size:12px;color:var(--barra-sub);letter-spacing:0}
#estante .prateleira{flex:1;overflow:auto;padding:28px 26px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:30px 26px;align-content:start}
.livro{cursor:pointer;position:relative;border:none;padding:0;background:transparent;text-align:left;display:flex;flex-direction:column;gap:8px}
.capa{position:relative;aspect-ratio:3/4;border-radius:6px 14px 14px 6px;box-shadow:0 8px 20px rgba(0,0,0,.22), inset 10px 0 0 rgba(0,0,0,.12);padding:22px 20px 18px 26px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.capa b{font-family:Cinzel,Georgia,serif;font-size:19px;line-height:1.2;word-break:break-word}
.capa .etq{background:rgba(255,255,255,.88);color:#3A3A3A;border-radius:6px;padding:8px 10px;font-family:Cinzel,Georgia,serif;font-size:16px;line-height:1.2}
.capa .linguetas{position:absolute;right:0;top:14%;display:flex;flex-direction:column;gap:3px}
.capa .linguetas i{display:block;width:9px;height:22px;border-radius:3px 0 0 3px;opacity:.95}
.capa small{font-size:12px;opacity:.85}
.livro .rodape{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--sub);font-size:12.5px}
.livro .rodape button{border:1px solid var(--borda);background:var(--painel);color:var(--tx);border-radius:8px;height:30px;padding:0 10px;font-size:13px}
.livro.atual .capa{outline:3px solid var(--ouro);outline-offset:3px}
.livro.novo .capa{background:transparent;border:2px dashed var(--borda);box-shadow:none;align-items:center;justify-content:center;color:var(--sub);font-size:15px;font-weight:600}

/* ---------- avisos ---------- */
#aviso{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--azul);color:#fff;border:1px solid var(--ouro);border-radius:14px;padding:11px 16px;font-size:14px;z-index:90;transition:.2s;
  max-width:min(560px,92vw);display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#aviso.vis{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#aviso button{background:var(--ouro);color:var(--azul);border:none;border-radius:9px;padding:7px 11px;font-weight:700;white-space:nowrap}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#16233F,#0B1426)}
#login form{background:#FFFDF6;color:#1B2438;border-radius:18px;padding:28px 24px;width:100%;max-width:370px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#login h1{font-family:Cinzel,Georgia,serif;font-size:24px;text-align:center;color:#16233F;margin:0 0 2px;letter-spacing:.6px}
#login .lema{font-family:Georgia,serif;font-style:italic;font-size:13px;text-align:center;color:#8A7A4A;margin:0 0 18px}
#login label{display:block;font-size:12px;color:#6B6658;margin:10px 0 5px;font-weight:600}
#login button{width:100%;margin-top:18px;padding:13px;border:none;border-radius:11px;background:#16233F;color:#fff;font-size:15px;font-weight:700}
#login .erro{color:#B2452F;font-size:13px;text-align:center;min-height:18px;margin-top:10px}
#login .ver{font-size:11px;text-align:center;color:#9A9384;margin-top:6px}
</style>
</head>
<body>
<div id="app">
  <header class="barra">
    <div class="b1">
      <button class="bt" id="bEstante" title="Estante (todos os cadernos)"></button>
      <button class="bt" id="bIndice" title="Índice"></button>
      <button class="bt" id="bPaginas" title="Páginas desta aba"></button>
      <div class="titulo"><b id="tTitulo">Índice</b><small id="tSub"></small></div>
      <button class="bt" id="bAnt" title="Página anterior"></button>
      <span class="num" id="tNum"></span>
      <button class="bt" id="bSeg" title="Próxima página"></button>
      <button class="bt" id="bNova" title="Nova página"></button>
      <button class="bt" id="bApagar" title="Apagar esta página"></button>
      <button class="sync" id="bSync" title="Sincronização"></button>
      <span class="versao" data-versao></span>
      <button class="bt" id="bTema" title="Modo claro / escuro"></button>
      <button class="bt" id="bAjustes" title="Ajustes"></button>
    </div>
    <div class="b2" id="ferramentas"></div>
  </header>
  <main class="palco" id="palco">
    <div class="folha" id="folha">
      <canvas id="cFundo"></canvas><canvas id="cBase"></canvas><canvas id="cVivo"></canvas>
      <div class="camada" id="camada"></div>
    </div>
    <div class="abas" id="abas"></div>
  </main>
</div>
<div id="aviso"></div>

const PASTEIS = ['#D99B94', '#D6C3D1', '#B7C9CC', '#E4BB96', '#BED1B6', '#EAD38F'];
const MODELOS = { pautada: 'Pautada', pontilhada: 'Pontilhada', sermao: 'Sermão / estudo', materia: 'Matéria', branco: 'Em branco', divisoria: 'Divisória', imagem: 'PDF / imagem' };
const CAMPOS = {
  cadernos: ['id', 'nome', 'cor', 'ordem', 'atualizado_em', 'apagado'],
  secoes: ['id', 'caderno_id', 'nome', 'cor', 'ordem', 'atualizado_em', 'apagado'],
  paginas: ['id', 'secao_id', 'ordem', 'modelo', 'tinta', 'textos', 'marcas', 'fundo', 'atualizado_em', 'apagado']
};
const TABELA = { cadernos: 'cd_cadernos', secoes: 'cd_secoes', paginas: 'cd_paginas' };
const TIPOS = ['cadernos', 'secoes', 'paginas'];
const D = { cadernos: new Map(), secoes: new Map(), paginas: new Map() };

const IDB = (() => {
  let dbp = null, falhou = false;
  function abrir(){
    if (dbp) return dbp;
    dbp = new Promise((ok, erro) => {
      const r = indexedDB.open('pergaminho', 3);
      r.onupgradeneeded = () => {
        const d = r.result;
        ['cadernos', 'secoes', 'paginas'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: 'id' }); });
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
        if (!d.objectStoreNames.contains('imagens')) d.createObjectStore('imagens', { keyPath: 'id' });
      };
      r.onsuccess = () => ok(r.result);
      r.onerror = () => erro(r.error);
    });
    return dbp;
  }
  async function tx(store, modo, fn){
    if (falhou) return undefined;
    try {
      const d = await abrir();
      return await new Promise((ok, erro) => {
        const t = d.transaction(store, modo), res = fn(t.objectStore(store));
        t.oncomplete = () => ok(res instanceof IDBRequest ? res.result : res);
        t.onerror = () => erro(t.error);
      });
    } catch (e) {
      if (!falhou){ falhou = true; aviso('Não consegui guardar no aparelho. Os dados ficam só na nuvem por enquanto.', 6000); }
      return undefined;
    }
  }
  return {
    todos: s => tx(s, 'readonly', st => st.getAll()),
    por: (s, o) => tx(s, 'readwrite', st => st.put(o)),
    varios: (s, l) => tx(s, 'readwrite', st => { l.forEach(o => st.put(o)); }),
    meta: k => tx('meta', 'readonly', st => st.get(k)),
    metaPor: (k, v) => tx('meta', 'readwrite', st => st.put(v, k)),
    pegar: (s, k) => tx(s, 'readonly', st => st.get(k)),
    zerar: () => Promise.all(['cadernos', 'secoes', 'paginas', 'meta', 'imagens'].map(s => tx(s, 'readwrite', st => st.clear())))
  };
})();

/* =====================================================================
   MODELOS DE PÁGINA (desenhados no canvas de fundo)
   x vai de 0 a 1 na largura; y vai de 0 a 1 na altura.
   ===================================================================== */
function modelo(ctx, pag, W, H, v, secaoCor){
  const X = x => (x - v.L) * v.z * W, Y = y => (y - v.T) * v.z * H, L = d => d * v.z * W, A = d => d * v.z * H;
  const out = { caixas: [], alvos: [] };
  const fonte = '"Josefin Sans", -apple-system, sans-serif';
  const ret = (x, y, w, h, r, cor) => {
    ctx.fillStyle = cor; ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(X(x), Y(y), L(w), A(h), L(r)); else ctx.rect(X(x), Y(y), L(w), A(h));
    ctx.fill();
  };
  const linha = (x1, y, x2, cor = '#D9D9D9', esp = .0011) => {
    ctx.strokeStyle = cor; ctx.lineWidth = Math.max(1, L(esp));
    ctx.beginPath(); ctx.moveTo(X(x1), Y(y)); ctx.lineTo(X(x2), Y(y)); ctx.stroke();
  };
  const texto = (t, x, y, tam, o = {}) => {
    ctx.fillStyle = o.cor || '#8A8A8A';
    ctx.font = `${o.peso || 400} ${L(tam)}px ${o.fam || fonte}`;
    ctx.textAlign = o.al || 'left'; ctx.textBaseline = 'middle';
    if ('letterSpacing' in ctx) ctx.letterSpacing = (o.esp ? L(o.esp) : 0) + 'px';
    ctx.fillText(t, X(x), Y(y));
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  };
  const marcas = (pag && pag.marcas) || {};
  const caixa = (id, x, yc, s = .017) => {
    const lado = L(s), px = X(x), py = Y(yc) - lado / 2;
    ctx.strokeStyle = '#BDBDBD'; ctx.lineWidth = Math.max(1, L(.0011)); ctx.strokeRect(px, py, lado, lado);
    if (marcas[id]){
      ctx.strokeStyle = '#14213F'; ctx.lineWidth = Math.max(1.5, L(.0028)); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(px + lado * .18, py + lado * .52); ctx.lineTo(px + lado * .42, py + lado * .78); ctx.lineTo(px + lado * .86, py + lado * .2); ctx.stroke();
    }
    const sh = s * W / H;
    out.caixas.push({ id, x: x - .012, y: yc - sh / 2 - .009, w: s + .024, h: sh + .018 });
  };
  const rodape = (cor = '#E4E4E4') => { linha(.05, .962, .95, cor); texto('Pergaminho', .05, .976, .0095, { cor: '#C9C9C9' }); };

  ctx.save();
  const m = pag ? pag.modelo : 'indice';

  if (m === 'indice'){
    texto('Índice', .5, .095, .046, { cor: '#5C5C5C', peso: 600, al: 'center' });
    const secs = secoesOrd(), n = secs.length;
    const passo = Math.min(.044, .74 / Math.max(1, n + 1)), alt = passo * .68;
    const tam = Math.min(.021, alt * H / W * .5);
    secs.forEach((s, i) => {
      const y = .16 + i * passo;
      ret(.22, y, .56, alt, .006, '#F1F1F1');
      ret(.22, y, .1, alt, .006, s.cor || PASTEIS[i % 6]);
      texto(s.nome || 'Sem nome', .345, y + alt / 2, tam, { cor: '#5A5A5A' });
      const k = paginasDe(s.id).filter(p => p.modelo !== 'divisoria').length;
      texto(k + (k === 1 ? ' pág.' : ' págs.'), .765, y + alt / 2, tam * .72, { cor: '#ABABAB', al: 'right' });
      out.alvos.push({ x: .22, y, w: .56, h: alt, acao: 'aba', id: s.id });
    });
    const y = .16 + n * passo;
    ctx.save(); ctx.setLineDash([L(.008), L(.006)]); ctx.strokeStyle = '#CFCFCF'; ctx.lineWidth = Math.max(1, L(.0012));
    ctx.strokeRect(X(.22), Y(y), L(.56), A(alt)); ctx.restore();
    texto('+  Nova aba', .5, y + alt / 2, tam, { cor: '#A0A0A0', al: 'center' });
    out.alvos.push({ x: .22, y, w: .56, h: alt, acao: 'novaAba' });
    if (!n) texto('Toque em “+ Nova aba” para começar o seu caderno', .5, y + alt + .04, .016, { cor: '#B0B0B0', al: 'center' });
    rodape();
  }
  else if (m === 'divisoria'){
    ctx.fillStyle = secaoCor || '#D99B94'; ctx.fillRect(0, 0, W, H);
    ret(.2, .4, .6, .034, .006, '#FFFFFF');
    const s = secaoDe(pag);
    texto(((s && s.nome) || 'Sem nome').toUpperCase(), .5, .417, .02, { cor: '#6B6B6B', peso: 600, al: 'center', esp: .003 });
    out.alvos.push({ x: .2, y: .4, w: .6, h: .034, acao: 'renomear' });
    linha(.05, .962, .95, 'rgba(255,255,255,.55)');
  }
  else if (m === 'pautada'){
    for (let y = .075; y < .952; y += .0262) linha(.05, y, .95);
    rodape();
  }
  else if (m === 'pontilhada'){
    const dy = .03 / ASP, r = Math.max(.8, L(.0016));
    ctx.fillStyle = '#C2C2C2'; ctx.beginPath();
    for (let y = .045; y < .955; y += dy) for (let x = .05; x < .951; x += .03){ ctx.moveTo(X(x) + r, Y(y)); ctx.arc(X(x), Y(y), r, 0, 7); }
    ctx.fill();
    rodape();
  }
  else if (m === 'sermao'){
    const destaque = secaoCor || '#C9A227';
    texto('Sermão / Estudo', .055, .062, .036, { cor: '#4F4F4F', peso: 600 });
    const rot = (t, x, y) => texto(t, x, y, .0115, { cor: '#8C8C8C', esp: .0012 });
    [['TEMA:', .055, .1, .55], ['TEXTO BÍBLICO:', .055, .126, .55], ['DATA:', .63, .1, .315], ['LOCAL:', .63, .126, .315]].forEach(([t, x, y, w]) => { ret(x, y, w, .02, .002, '#EFEFEF'); rot(t, x + .01, y + .01); });
    rot('PROPOSIÇÃO', .055, .172); ret(.055, .183, .89, .034, .003, '#F5F5F5');
    let y = .245;
    [['INTRODUÇÃO', 3], ['1º PONTO', 3], ['2º PONTO', 3], ['3º PONTO', 3], ['4º PONTO', 3], ['CONCLUSÃO / APELO', 3]].forEach(([t, n]) => {
      ret(.055, y - .008, .008, .016, .002, destaque); rot(t, .072, y);
      y += .012;
      for (let i = 0; i < n; i++){ y += .0255; linha(.055, y, .945); }
      y += .028;
    });
    rodape();
  }
  else if (m === 'imagem'){
    const f = (pag && pag.fundo) || {}, r = encaixe(f);
    const im = imagemPronta(f.img);
    if (im){
      ctx.drawImage(im, X(r.x), Y(r.y), L(r.w), A(r.h));
      ctx.strokeStyle = '#E3E3E3'; ctx.lineWidth = Math.max(1, L(.001)); ctx.strokeRect(X(r.x), Y(r.y), L(r.w), A(r.h));
    } else {
      ret(r.x, r.y, r.w, r.h, .004, '#F3F1EC');
      texto(f.img ? 'carregando a página…' : 'sem imagem', r.x + r.w / 2, r.y + r.h / 2, .016, { cor: '#B5AE9E', al: 'center' });
      if (f.img) carregarImagem(f.img).then(i => { if (i) aoChegarImagem(f.img); });
    }
    if (r.y + r.h < .62) for (let y = r.y + r.h + .05; y < .952; y += .0262) linha(.05, y, .95);   // slide deitado: pauta embaixo para anotar
    rodape();
  }
  else if (m === 'materia'){
    texto('Matéria', .055, .062, .036, { cor: '#4F4F4F', peso: 600 });
    const rot = (t, x, y) => texto(t, x, y, .0115, { cor: '#8C8C8C', esp: .0012 });
    ['MATÉRIA:', 'LOCAL:', 'HORÁRIO:', 'PROFESSOR(A):'].forEach((t, i) => {
      const y = .108 + i * .026; ret(.055, y, .37, .02, .002, '#EFEFEF'); rot(t, .065, y + .01);
    });
    rot('MATERIAIS', .48, .1); linha(.48, .112, .945, '#BDBDBD');
    for (let i = 0; i < 4; i++){
      const y = .132 + i * .026;
      caixa('mat' + i, .48, y); linha(.505, y + .007, .69);
      caixa('mat' + (i + 4), .72, y); linha(.745, y + .007, .945);
    }
    rot('TESTES', .055, .245);
    texto('DATA', .125, .275, .0115, { cor: '#8C8C8C', al: 'center', esp: .0012 });
    texto('TESTE', .31, .275, .0115, { cor: '#8C8C8C', al: 'center', esp: .0012 });
    texto('O QUE ESTUDAR', .705, .275, .0115, { cor: '#8C8C8C', al: 'center', esp: .0012 });
    for (let i = 0; i < 7; i++){
      const y = .305 + i * .03;
      caixa('tes' + i, .055, y); linha(.082, y + .007, .17); linha(.19, y + .007, .44); linha(.465, y + .007, .945);
    }
    rot('ENTREGAS', .055, .54);
    texto('DATA', .125, .57, .0115, { cor: '#8C8C8C', al: 'center', esp: .0012 });
    texto('ENTREGAS', .31, .57, .0115, { cor: '#8C8C8C', al: 'center', esp: .0012 });
    for (let i = 0; i < 12; i++){
      const y = .6 + i * .029;
      caixa('ent' + i, .055, y); linha(.082, y + .007, .17); linha(.19, y + .007, .44);
    }
    ret(.465, .585, .48, .355, .002, '#EFEFEF'); rot('ANOTAÇÕES', .48, .6);
    rodape();
  }
  if (pag && pag.fundo && pag.fundo.figs) pag.fundo.figs.forEach(f => {
    const im = imagemPronta(f.img);
    if (im) ctx.drawImage(im, X(f.x), Y(f.y), L(f.w), A(f.h));
    else { ret(f.x, f.y, f.w, f.h, .003, '#F1EEE8'); carregarImagem(f.img).then(i => { if (i) aoChegarImagem(f.img); }); }
  });
  ctx.restore();
  return out;
}

/* ---------- traços da caneta ---------- */
const larg = pr => .45 + .9 * pr;
function desenharTraco(ctx, s, W, H, v){
  const p = s.p, k = p.length / 3; if (!k) return;
  const X = i => (p[i * 3] - v.L) * v.z * W, Y = i => (p[i * 3 + 1] - v.T) * v.z * H, Pr = i => p[i * 3 + 2];
  const base = s.w * W * v.z;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = s.c; ctx.fillStyle = s.c;
  if (s.t === 'h'){
    ctx.globalAlpha = .35; ctx.lineWidth = base; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(X(0), Y(0)); if (k === 1) ctx.lineTo(X(0) + .1, Y(0));
    for (let i = 1; i < k; i++){
      const nx = i < k - 1 ? (X(i) + X(i + 1)) / 2 : X(i), ny = i < k - 1 ? (Y(i) + Y(i + 1)) / 2 : Y(i);
      ctx.quadraticCurveTo(X(i), Y(i), nx, ny);
    }
    ctx.stroke(); ctx.restore(); return;
  }
  if (k === 1){ ctx.beginPath(); ctx.arc(X(0), Y(0), base * larg(Pr(0)) / 2, 0, 7); ctx.fill(); ctx.restore(); return; }
  let mx = X(0), my = Y(0);
  for (let i = 1; i < k; i++){
    const nx = i < k - 1 ? (X(i) + X(i + 1)) / 2 : X(i), ny = i < k - 1 ? (Y(i) + Y(i + 1)) / 2 : Y(i);
    ctx.lineWidth = base * larg((Pr(i - 1) + Pr(i)) / 2);
    ctx.beginPath(); ctx.moveTo(mx, my); ctx.quadraticCurveTo(X(i), Y(i), nx, ny); ctx.stroke();
    mx = nx; my = ny;
  }
  ctx.restore();
}

/* miniatura de uma página inteira (para os painéis) */
function desenharMini(canvas, pag){
  const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth || 130, h = w * ASP;
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext('2d'), W = canvas.width, H = canvas.height, v = { z: 1, L: 0, T: 0 };
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  const s = secaoDe(pag);
  modelo(ctx, pag, W, H, v, (s && s.cor) || pag._cor);
  (pag.tinta || []).forEach(t => desenharTraco(ctx, t, W, H, v));
  desenharTextos(ctx, pag, W, H);
}
function desenharTextos(ctx, pag, W, H){
  (pag.textos || []).forEach(t => {
    if (!t.t) return;
    const tam = t.s * W, max = t.w * W; let y = t.y * H;
    ctx.save(); ctx.fillStyle = t.c || '#14213F'; ctx.font = `${tam}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`; ctx.textBaseline = 'top';
    t.t.split('\n').forEach(par => {
      let lin = '';
      par.split(' ').forEach(p => {
        const tent = lin ? lin + ' ' + p : p;
        if (ctx.measureText(tent).width > max && lin){ ctx.fillText(lin, t.x * W, y); y += tam * 1.32; lin = p; } else lin = tent;
      });
      ctx.fillText(lin, t.x * W, y); y += tam * 1.32;
    });
    ctx.restore();
  });
}

/* =====================================================================
   IMAGENS DE FUNDO (páginas de PDF e fotos)
   Ficam no aparelho (IndexedDB) e na nuvem (Storage do Supabase, pasta do usuário).
   ===================================================================== */
const BUCKET = 'pergaminho';
const IMG = new Map();             // id -> { im, prom }
const imagemPronta = id => (id && IMG.get(id) && IMG.get(id).im) || null;
function blobParaImagem(blob){
  return new Promise(ok => { const u = URL.createObjectURL(blob), im = new Image(); im.onload = () => ok(im); im.onerror = () => ok(null); im.src = u; });
}
function carregarImagem(id){
  if (!id) return Promise.resolve(null);
  const c = IMG.get(id); if (c) return c.prom;
  const prom = (async () => {
    let reg = await IDB.pegar('imagens', id);
    if (!reg && sb && uid && navigator.onLine){
      try {
        const { data, error } = await sb.storage.from(BUCKET).download(`${uid}/${id}.jpg`);
        if (!error && data){ reg = { id, blob: data, subiu: true }; IDB.por('imagens', reg); }
      } catch {}
    }
    if (!reg){ IMG.delete(id); return null; }            // tenta de novo mais tarde
    const im = await blobParaImagem(reg.blob);
    IMG.set(id, { im, prom }); return im;
  })();
  IMG.set(id, { im: null, prom });
  return prom;
}

async function processarArquivo(arq, nome, onde){
  gravarTintaAgora();
  let sid, depois;
  if (onde === 'aqui' && P){ sid = P.secao_id; depois = P.id; }
  else {
    const secs = secoesOrd();
    const s = { id: novoId(), caderno_id: garantirCadernoAtual(), nome, cor: PASTEIS[secs.length % 6], ordem: secs.length ? secs[secs.length - 1].ordem + 1 : 1, apagado: false };
    tocar('secoes', s); sid = s.id; depois = null;
  }
  const lista = paginasDe(sid);
  let idx = depois ? lista.findIndex(p => p.id === depois) : lista.length - 1;
  let ordem0 = idx >= 0 ? lista[idx].ordem : 0, ordemFim = lista[idx + 1] ? lista[idx + 1].ordem : ordem0 + 1e6;
  const criadas = [];
  const criar = async fundo => {
    const passo = (ordemFim - ordem0) / 1e4;   // cabe muitas páginas entre a atual e a próxima
    ordem0 += passo;

    tocar('paginas', pg); criadas.push(pg);

      aviso('Abrindo o PDF…', 0);

      const doc = await lib.getDocument({ data: await arq.arrayBuffer() }).promise;
      for (let n = 1; n <= doc.numPages; n++){
        aviso(`Importando página ${n} de ${doc.numPages}…`, 0);
        const pagina = await doc.getPage(n), v1 = pagina.getViewport({ scale: 1 });
        const vp = pagina.getViewport({ scale: LARG_IMG / v1.width });
        const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
        const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
        await pagina.render({ canvasContext: ctx, viewport: vp }).promise;
        await criar(await guardarImagem(await canvasParaJpeg(cv), cv.width, cv.height));

      aviso('Importando a imagem…', 0);
      const im = await blobParaImagem(arq); if (!im) throw new Error('não consegui abrir a imagem');
      const esc_ = Math.min(1, LARG_IMG / im.naturalWidth);
      const cv = document.createElement('canvas'); cv.width = Math.round(im.naturalWidth * esc_); cv.height = Math.round(im.naturalHeight * esc_);
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(im, 0, 0, cv.width, cv.height);
      await criar(await guardarImagem(await canvasParaJpeg(cv), cv.width, cv.height));
    }
    aviso(`${criadas.length} ${criadas.length === 1 ? 'página importada' : 'páginas importadas'} ✓`);
    if (criadas.length) abrir(criadas[0].id);
    agendarEnvio();

    aviso('Não consegui importar: ' + (e.message || e), 7000);
    if (criadas.length) abrir(criadas[0].id); else desenharTudo();
  }
}

function medir(){

  w = Math.floor(w); h = Math.floor(h);
  const left = Math.floor((pal.width - w - abaW) / 2), top = Math.floor((pal.height - h) / 2);
  Object.assign(cx.folha.style, { width: w + 'px', height: h + 'px', left: left + 'px', top: top + 'px' });

  Object.assign(cx.abas.style, { left: (left + w) + 'px', top: (top + h * .02) + 'px', height: (h * .96) + 'px' });
  const dpr = window.devicePixelRatio || 1;
  [cx.fundo, cx.base, cx.vivo].forEach(c => { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); });

  const soToque = !P || dedoLivre || est.ferr === 'texto' || (e.pointerType === 'mouse' && alvoEm(e)) || (e.pointerType === 'pen' && est.ferr === 'mao');
  if (soToque || est.ferr === 'mao'){
    if (!e.isPrimary || ativo !== null) return;
    if (!(est.ferr === 'texto' && P)) { try { cx.palco.setPointerCapture(e.pointerId); } catch {} }
    ativo = e.pointerId;
    const r = cx.folha.getBoundingClientRect();
    toque = { x: e.clientX, y: e.clientY, t: performance.now(), largo: (e.width || 0) > 50 };
    if (V.z > 1 && (dedoLivre || est.ferr === 'mao')) arrasto = { x: e.clientX, y: e.clientY, L: V.L, T: V.T, w: r.width, h: r.height };
    return;
  }
  if (e.button > 0 || ativo !== null) return;
  const pt = ponto(e); if (!pt.dentro) return;
  e.preventDefault();
  try { cx.palco.setPointerCapture(e.pointerId); } catch {}
  ativo = e.pointerId;
  if (est.ferr === 'borracha'){ antesBorracha = tracos.slice(); apagou = false; apagarEm(e); return; }
  if (est.ferr === 'figura'){ ativo = null; return; }
  if (est.ferr === 'forma'){
    atual = { t: 'p', c: CORES[est.cor] || CORES.marinho, w: GROSSURA[est.gr], p: [], ini: pt, k: est.forma || 'ret' };
    return;
  }
  const marca = est.ferr === 'marca';
  atual = { t: marca ? 'h' : 'p', c: marca ? marcaCor() : (CORES[est.cor] || CORES.marinho), w: GROSSURA[est.gr] * (marca ? 6 : 1), p: [] };
  atual.p.push(pt.x, pt.y, pressao(e));

/* formas viram traços comuns (a borracha, o desfazer e a sincronização funcionam igual) */
function gerarForma(k, a, b){
  // trabalha num espaço sem distorção: u = x, v = y × (altura/largura)
  const A = [a.x, a.y * ASP], B = [b.x, b.y * ASP], pts = [];
  const add = (u, v) => pts.push(+u.toFixed(4), +(v / ASP).toFixed(4), .5);
  const seg = (p, q, n = 14) => { for (let i = pts.length ? 1 : 0; i <= n; i++) add(p[0] + (q[0] - p[0]) * i / n, p[1] + (q[1] - p[1]) * i / n); };
  const poli = l => l.slice(1).forEach((q, i) => seg(l[i], q));
  let du = B[0] - A[0], dv = B[1] - A[1];
  if (k === 'lin') seg(A, B, 20);
  else if (k === 'seta'){
    const comp = Math.hypot(du, dv) || 1e-6, cab = Math.min(.035, comp * .35), ang = Math.atan2(dv, du);
    const h1 = [B[0] - cab * Math.cos(ang - .45), B[1] - cab * Math.sin(ang - .45)], h2 = [B[0] - cab * Math.cos(ang + .45), B[1] - cab * Math.sin(ang + .45)];
    poli([A, B, h1]); seg(h1, B, 6); seg(B, h2, 6);
  }
  else if (k === 'ret') poli([A, [B[0], A[1]], B, [A[0], B[1]], A]);
  else if (k === 'tri') poli([[(A[0] + B[0]) / 2, A[1]], B, [A[0], B[1]], [(A[0] + B[0]) / 2, A[1]]]);
  else if (k === 'eli'){
    if (Math.abs(Math.abs(du) - Math.abs(dv)) < .12 * Math.max(Math.abs(du), Math.abs(dv))){ const m = Math.max(Math.abs(du), Math.abs(dv)); du = Math.sign(du || 1) * m; dv = Math.sign(dv || 1) * m; }   // quase redondo → círculo perfeito
    const cu = A[0] + du / 2, cv = A[1] + dv / 2, ru = Math.abs(du / 2), rv = Math.abs(dv / 2);
    for (let i = 0; i <= 80; i++){ const t = i / 80 * Math.PI * 2; add(cu + ru * Math.cos(t), cv + rv * Math.sin(t)); }
  }
  return pts;
}

function moveu(e){
  if (e.pointerType === 'pen') ultimaCaneta = performance.now();
  if (e.pointerId !== ativo) return;
  e.preventDefault();
  if (arrasto){ setVista(V.z, arrasto.L - (e.clientX - arrasto.x) / (arrasto.w * V.z), arrasto.T - (e.clientY - arrasto.y) / (arrasto.h * V.z)); return; }
  if (toque) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e], lista = evs.length ? evs : [e];
  if (est.ferr === 'borracha'){ lista.forEach(apagarEm); return; }
  if (!atual) return;
  if (atual.ini){ const pt = ponto(e); atual.p = gerarForma(atual.k, atual.ini, pt); desenharVivo(); return; }
  lista.forEach(ev => { const pt = ponto(ev); atual.p.push(pt.x, pt.y, pressao(ev)); });
  desenharVivo();
}

function soltou(e){
  if (e.pointerId !== ativo) return;
  ativo = null;
  if (toque){
    const dx = e.clientX - toque.x, dy = e.clientY - toque.y, dt = performance.now() - toque.t, foiArrasto = !!arrasto;
    const t = toque; toque = null; arrasto = null;
    if (e.type === 'pointercancel') return;
    const pequeno = Math.abs(dx) < 10 && Math.abs(dy) < 10;
    if (pequeno && dt < 600 && !t.largo){ if (!(est.ferr === 'texto' && P)) tocou(e); return; }
    if (!foiArrasto && V.z === 1 && dt < 700 && Math.abs(dx) > 80 && Math.abs(dx) > 2 * Math.abs(dy)) navegar(dx < 0 ? 1 : -1);
    return;
  }
  if (est.ferr === 'borracha'){
    if (apagou){ desf.push(antesBorracha); if (desf.length > 80) desf.shift(); refz = []; mudouTinta(); }
    antesBorracha = null; return;
  }
  if (!atual) return;
  if (atual.ini && atual.p.length < 6){ atual = null; desenharVivo(); return; }
  const s = { t: atual.t, c: atual.c, w: +atual.w.toFixed(5), p: atual.p.map((v, i) => i % 3 === 2 ? Math.round(v * 100) / 100 : Math.round(v * 10000) / 10000) };
  atual = null;
  fotografar(); tracos.push(s);
  desenharTraco(cx.base.getContext('2d'), s, cx.base.width, cx.base.height, V); desenharVivo(); mudouTinta();
}

/* toque curto: caixinha, aba do índice, renomear a divisória */
function tocou(e){
  const pt = ponto(e); if (!pt.dentro) return;
  const c = P && achar(alvos.caixas, pt);
  if (c){ P.marcas = { ...(P.marcas || {}) }; if (P.marcas[c.id]) delete P.marcas[c.id]; else P.marcas[c.id] = 1; tocar('paginas', P); desenharFundo(); return; }
  const a = achar(alvos.alvos, pt); if (!a) return;
  if (a.acao === 'aba'){ const pgs = paginasDe(a.id); if (pgs.length) abrir(pgs[0].id); else aviso('Esta aba ainda não tem páginas'); }
  else if (a.acao === 'novaAba') painelNovaAba();

/* borracha: apaga o traço inteiro que tocar */
function distSeg(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0; t = limitar(t, 0, 1);
  const x = ax + t * dx - px, y = ay + t * dy - py; return Math.sqrt(x * x + y * y);
}
function apagarEm(e){
  const r = cx.folha.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top, raio = 12, W = r.width, H = r.height;
  const fica = tracos.filter(s => {
    const p = s.p, k = p.length / 3, folga = raio + s.w * W * V.z / 2;
    for (let i = 0; i < k; i++){
      const ax = (p[i * 3] - V.L) * V.z * W, ay = (p[i * 3 + 1] - V.T) * V.z * H;
      const bx = i + 1 < k ? (p[(i + 1) * 3] - V.L) * V.z * W : ax, by = i + 1 < k ? (p[(i + 1) * 3 + 1] - V.T) * V.z * H : ay;
      if (distSeg(px, py, ax, ay, bx, by) <= folga) return false;
    }
    return true;
  });
  if (fica.length !== tracos.length){ tracos = fica; apagou = true; redesenhar(); }
}

/* desfazer · refazer · limpar */

/* zoom */
function setVista(z, L, T){
  z = limitar(z, 1, 4);
  V = { z, L: limitar(L, 0, 1 - 1 / z), T: limitar(T, 0, 1 - 1 / z) };

}
const ZS = [1, 1.5, 2, 3, 4];
function zoomPasso(d){

  const cx0 = V.L + .5 / V.z, cy0 = V.T + .5 / V.z;

async function inserirFigura(){
  if (!P) return;
  const arq = await new Promise(ok => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.className = 'oculto';
    i.onchange = () => { ok(i.files[0] || null); i.remove(); }; document.body.appendChild(i); i.click();
  });
  if (!arq) return;
  try {
    const im = await blobParaImagem(arq); if (!im) throw new Error('não consegui abrir a imagem');
    const k = Math.min(1, LARG_IMG / im.naturalWidth), cv = document.createElement('canvas');
    cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
    const png = /png|gif|webp/i.test(arq.type);                 // PNG mantém o fundo transparente
    const ctx = cv.getContext('2d'); if (!png){ ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); }
    ctx.drawImage(im, 0, 0, cv.width, cv.height);
    const blob = await new Promise(ok => cv.toBlob(ok, png ? 'image/png' : 'image/jpeg', .86));
    const g = await guardarImagem(blob, cv.width, cv.height);
    let w = .5, h = w * (cv.height / cv.width) / ASP;
    if (h > .6){ h = .6; w = h * ASP * cv.width / cv.height; }
    const cx0 = V.L + .5 / V.z, cy0 = V.T + .5 / V.z;
    const f = { id: novoId(), img: g.img, ar: cv.height / cv.width, x: limitar(cx0 - w / 2, 0, 1 - w), y: limitar(cy0 - h / 2, 0, 1 - h), w, h };
    P.fundo = { ...(P.fundo || {}), figs: [...((P.fundo && P.fundo.figs) || []), f] };
    tocar('paginas', P);
    est.ferr = 'figura'; guardarEst(); desenharTudo();
    aviso('Imagem inserida · arraste para mover, puxe o canto dourado para o tamanho · depois toque no lápis', 5000);
  } catch (e) { aviso('Não consegui inserir: ' + (e.message || e), 6000); }
}

/* apagar a página que está aberta: primeiro toque arma (botão vermelho), o segundo apaga */
let armadoApagar = null;
function apagarPaginaAtual(bt){
  if (!P) return;
  if (!armadoApagar){
    armadoApagar = setTimeout(() => { armadoApagar = null; bt.style.background = ''; }, 3500);
    bt.style.background = '#C0392B';
    aviso('Toque de novo no lixo para apagar esta página', 3500);
    return;
  }
  clearTimeout(armadoApagar); armadoApagar = null; bt.style.background = '';
  gravarTintaAgora();
  const sid = P.secao_id, i = paginasDe(sid).findIndex(p => p.id === P.id);
  P.apagado = true; tocar('paginas', P);
  const resto = paginasDe(sid);
  abrir(resto.length ? resto[Math.min(i, resto.length - 1)].id : 'indice');

const CORES_CAPA = ['#0F1B33', '#5B2A3A', '#2F4A3F', '#6B4F2A', '#3E5C76', '#4B3F6B', '#2B2B2B', '#C9A227', '#D99B94', '#B7C9CC', '#BED1B6', '#E4BB96'];
const capaClara = c => { const n = parseInt(c.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; return (r * 299 + g * 587 + b * 114) / 1000 > 150; };

/* todo usuário tem um caderno principal com o mesmo id da conta (assim o iPad e o Mac não criam dois);
   as abas antigas, que ainda não têm caderno, vão para ele */
function garantirCadernos(){
  if (!uid) return;
  const principal = uid;
  const soltas = [...D.secoes.values()].filter(s => !s.caderno_id);
  if ((soltas.length || !cadernosOrd().length) && !D.cadernos.get(principal)){
    tocar('cadernos', { id: principal, nome: 'Meu caderno', cor: '#0F1B33', ordem: 1, apagado: false });
  }
  soltas.forEach(s => { if (s.caderno_id !== principal){ s.caderno_id = principal; tocar('secoes', s); } });
  if (!cadernoAtual || !D.cadernos.get(cadernoAtual) || D.cadernos.get(cadernoAtual).apagado){
    const c = cadernosOrd()[0]; cadernoAtual = c ? c.id : null; gravarLS('pg.caderno', cadernoAtual);
  }
}
function garantirCadernoAtual(){ if (!cadernoAtual || !D.cadernos.get(cadernoAtual)) garantirCadernos(); return cadernoAtual; }
function abrirCaderno(cid){
  gravarTintaAgora();
  cadernoAtual = cid; gravarLS('pg.caderno', cid);
  esconderEstante();
  const ult = lerLS('pg.atualPorCaderno', {})[cid];
  const p = ult && D.paginas.get(ult);
  abrir(p && !p.apagado && (secaoDe(p) || {}).caderno_id === cid ? ult : 'indice');
}
const estanteAberta = () => !!$('#estante');
function mostrarEstante(){
  gravarTintaAgora(); fecharPainel();

  if (!$('#estante')){

function esconderEstante(){ const d = $('#estante'); if (d) d.remove(); gravarLS('pg.naEstante', false); }
function pintarEstante(){
  const pr = $('#prateleira'); if (!pr) return;

function painelCaderno(cid){
  const c = cid ? D.cadernos.get(cid) : null;
  let cor = c ? c.cor : CORES_CAPA[cadernosOrd().length % CORES_CAPA.length];
  painel(cab(c ? 'Caderno' : 'Novo caderno') + `<h3>Nome</h3><input class="campo" id="cdNome" maxlength="40" placeholder="Ex.: Faculdade, Sermões 2027, Reuniões" value="${esc(c ? c.nome : '')}">
    <h3>Cor da capa</h3><div class="cores" id="cdCores">${CORES_CAPA.map(x => `<button data-c="${x}" style="background:${x}"></button>`).join('')}</div>
    ${c ? `<h3>Posição na estante</h3><div style="display:flex;gap:10px"><button class="botao" id="cdEsq">← Para a esquerda</button><button class="botao" id="cdDir">Para a direita →</button></div>` : '<p style="margin-top:14px">O caderno novo começa com uma aba “Anotações”.</p>'}
    <div style="display:flex;justify-content:space-between;gap:10px;margin-top:20px">
      ${c ? '<button class="botao perigo" id="cdApagar">Apagar caderno</button>' : '<span></span>'}
      <button class="botao forte" id="cdOk">${c ? 'Salvar' : 'Criar caderno'}</button></div>`, k => {
    const pintar = () => $$('#cdCores button', k).forEach(b => b.classList.toggle('on', b.dataset.c === cor));
    pintar();
    $('#cdCores', k).onclick = e => { const b = e.target.closest('[data-c]'); if (b){ cor = b.dataset.c; pintar(); } };
    $('#cdOk', k).onclick = () => {
      const nome = $('#cdNome', k).value.trim(); if (!nome){ $('#cdNome', k).focus(); return; }
      if (c){ c.nome = nome; c.cor = cor; tocar('cadernos', c); fecharPainel(); pintarEstante(); pintarBarra(); return; }
      const lista = cadernosOrd();
      const novo = { id: novoId(), nome, cor, ordem: lista.length ? lista[lista.length - 1].ordem + 1 : 1, apagado: false };
      tocar('cadernos', novo); fecharPainel();
      cadernoAtual = novo.id; gravarLS('pg.caderno', novo.id);
      criarAba('Anotações', PASTEIS[0], false);
      pintarEstante(); aviso('Caderno “' + nome + '” criado · toque nele para abrir');
    };
    if (!c){ setTimeout(() => $('#cdNome', k).focus(), 80); return; }
    const mover = d => {
      const lista = cadernosOrd(), i = lista.findIndex(x => x.id === c.id), j = i + d; if (j < 0 || j >= lista.length) return;
      const o = c.ordem; c.ordem = lista[j].ordem; lista[j].ordem = o; tocar('cadernos', c); tocar('cadernos', lista[j]); pintarEstante();
    };
    $('#cdEsq', k).onclick = () => mover(-1); $('#cdDir', k).onclick = () => mover(1);
    let armado = false;
    $('#cdApagar', k).onclick = e => {
      if (cadernosOrd().length <= 1){ aviso('Este é o único caderno da estante — crie outro antes de apagar este.'); return; }
      const b = e.currentTarget, n = paginasDoCaderno(c.id).length;
      if (!armado){ armado = true; b.classList.add('armado'); b.textContent = `Apagar “${c.nome}” com ${n} páginas?`; return; }
      secoesDe(c.id).forEach(s => { paginasDe(s.id).forEach(p => { p.apagado = true; tocar('paginas', p); }); s.apagado = true; tocar('secoes', s); });
      c.apagado = true; tocar('cadernos', c);
      if (cadernoAtual === c.id){ cadernoAtual = cadernosOrd()[0].id; gravarLS('pg.caderno', cadernoAtual); abrir('indice'); }
      fecharPainel(); pintarEstante(); aviso('Caderno apagado');
    };
  });
}

    };
  });
}

    $('#ajTema', c).onclick = () => { gravarLS('pg.tema', lerLS('pg.tema', 'claro') === 'escuro' ? 'claro' : 'escuro'); aplicarTema(); painelAjustes(); };
    $('#ajDedo', c).onclick = () => { est.dedo = !est.dedo; guardarEst(); pintarFerramentas(); painelAjustes(); };
    $('#ajSync', c).onclick = async () => { await sincronizar(true); painelAjustes(); };
    $('#ajExp', c).onclick = exportar;
    $('#ajPdf', c).onclick = painelExportar;
    $('#ajImp', c).onclick = () => $('#ajArq', c).click();
    $('#ajArq', c).onchange = e => importar(e.target.files[0]);
    $('#ajVer', c).onclick = () => verificarVersao(true);
    $('#ajAtu', c).onclick = atualizarApp;
    $('#ajSair', c).onclick = sair;
  });
}
async function diagnostico(){
  const pend = [...D.secoes.values(), ...D.paginas.values()].filter(o => o._p).length;
  const aqui = `Neste aparelho: ${secoesOrd().length} abas, ${[...D.paginas.values()].filter(p => !p.apagado).length} páginas, ${pend} esperando para subir.`;
  let nuvem = 'Na nuvem: —';
  if (sb && navigator.onLine){
    try {
      const s = await sb.auth.getSession(), u = s.data && s.data.session && s.data.session.user;
      if (!u) nuvem = 'Na nuvem: sem login válido neste aparelho';
      else {
        const a = await sb.from('cd_secoes').select('id', { count: 'exact', head: true }).eq('apagado', false);
        const p = await sb.from('cd_paginas').select('id', { count: 'exact', head: true }).eq('apagado', false);
        nuvem = (a.error || p.error) ? 'Na nuvem: erro · ' + esc((a.error || p.error).message) : `Na nuvem: ${a.count} abas, ${p.count} páginas (conta ${esc(u.email)})`;
      }
    } catch (e) { nuvem = 'Na nuvem: erro · ' + esc(e.message || e); }
  }
  return esc(aqui) + '<br>' + nuvem + (ultimoErro ? '<br><span style="color:#C0392B">Último erro: ' + esc(ultimoErro) + '</span>' : '');
}
function limpo(tipo, o){ const r = {}; CAMPOS[tipo].forEach(k => { if (o[k] !== undefined && !(k === 'fundo' && o[k] === null)) r[k] = o[k]; }); return r; }
function exportar(){
  gravarTintaAgora();
  const pacote = { app: 'Pergaminho', versao: VERSAO, exportado_em: agora(),
    cadernos: [...D.cadernos.values()].filter(c => !c.apagado).map(c => limpo('cadernos', c)),
    secoes: [...D.secoes.values()].filter(s => !s.apagado).map(s => limpo('secoes', s)),
    paginas: [...D.paginas.values()].filter(p => !p.apagado).map(p => limpo('paginas', p)) };
  const blob = new Blob([JSON.stringify(pacote)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `pergaminho-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function importar(arq){
  if (!arq) return;
  try {
    const j = JSON.parse(await arq.text());
    if (j.app !== 'Pergaminho') throw new Error('arquivo de outro app');
    let n = 0;
    TIPOS.forEach(tipo => (j[tipo] || []).forEach(r => {
      const l = D[tipo].get(r.id);
      if (!l || new Date(r.atualizado_em) > new Date(l.atualizado_em)){ const o = limpo(tipo, r); D[tipo].set(o.id, o); tocar(tipo, o); n++; }
    }));
    garantirCadernos(); fecharPainel(); abrir(atualId); aviso(n ? `Backup importado (${n} itens)` : 'Nada novo no backup — tudo já estava aqui');
  } catch (e) { aviso('Não consegui ler esse arquivo: ' + e.message, 5000); }
}

/* ---------- versão nova ---------- */
let avisouVersao = null;
async function verificarVersao(manual){
  try {
    const r = await fetch('index.html?nc=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw 0;
    const m = (await r.text()).match(/const VERSAO = '([^']+)'/), v = m && m[1];
    if (v && v !== VERSAO){ if (manual || avisouVersao !== v){ avisouVersao = v; aviso(`Nova versão do Pergaminho disponível (v${v}).`, 0, { rotulo: 'Atualizar agora', fazer: atualizarApp }); } }
    else if (manual) aviso(`Você já está na versão mais nova (v${VERSAO}).`);
  } catch { if (manual) aviso('Sem internet para verificar agora.'); }
}
async function atualizarApp(){
  gravarTintaAgora();
  try { await sincronizar(); } catch {}
  try { if ('serviceWorker' in navigator){ const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.unregister())); } } catch {}
  try { if (window.caches){ const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } } catch {}
  location.replace(location.pathname + '?v=' + Date.now());
}

/* =====================================================================
   LOGIN E SINCRONIZAÇÃO COM O SUPABASE
   ===================================================================== */
let avisouSQL2 = false, avisouSQL3 = false, ultimoErro = '', sb = null, uid = lerLS('pg.uid', null), sincronizando = false, deNovo = false, tEnvio = null, estadoSync = 'off', avisouSQL = false;

function mostrarLogin(msg){
  if ($('#login')){ if (msg) $('#loginErro').textContent = msg; return; }
  const d = document.createElement('div'); d.id = 'login';
  d.innerHTML = `<form autocomplete="on"><h1>Pergaminho</h1><p class="lema">“…e os livros, especialmente os pergaminhos.” 2Tm 4.13</p>
    <label for="lgEmail">E-mail</label><input class="campo" id="lgEmail" type="email" inputmode="email" autocomplete="username" value="${esc(lerLS('pg.email', '') || localStorage.getItem('bispo-email') || '')}">
    <label for="lgSenha">Senha</label><input class="campo" id="lgSenha" type="password" autocomplete="current-password">
    <button type="submit" id="lgBtn">Entrar</button><div class="erro" id="loginErro">${esc(msg || '')}</div><div class="ver">v${VERSAO}</div></form>`;
  document.body.appendChild(d);
  d.querySelector('form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const email = $('#lgEmail').value.trim(), senha = $('#lgSenha').value, err = $('#loginErro'), btn = $('#lgBtn');
    if (!email || !senha){ err.textContent = 'Preencha e-mail e senha.'; return; }
    if (!sb){ err.textContent = 'Sem conexão. Tente de novo com internet.'; return; }
    btn.disabled = true; btn.textContent = 'Entrando...';
    const r = await sb.auth.signInWithPassword({ email, password: senha });
    btn.disabled = false; btn.textContent = 'Entrar';
    if (r.error){ err.textContent = /invalid/i.test(r.error.message || '') ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar. Confira a internet.'; return; }
    try { localStorage.setItem('bispo-email', email); } catch {}
    definirUsuario(r.data.user); d.remove();
    await sincronizar(); if (estadoSync === 'ok') semente();
  });
  setTimeout(() => { const a = $($('#lgEmail').value ? '#lgSenha' : '#lgEmail'); if (a) a.focus(); }, 80);
}
function definirUsuario(u){
  if (!u) return;
  uid = u.id; gravarLS('pg.uid', uid); gravarLS('pg.email', u.email || '');
}
async function sair(){
  gravarTintaAgora();
  try { await sincronizar(); } catch {}
  try { if (sb) await sb.auth.signOut(); } catch {}
  localStorage.removeItem('pg.uid'); await IDB.zerar(); location.reload();
}

async function iniciarNuvem(){
  if (!window.supabase){ if (!uid) mostrarLogin('Sem conexão. Abra de novo com internet.'); pintarSync(); return; }
  sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { storageKey: 'bispo-auth', persistSession: true, autoRefreshToken: true } });
  let sess = null;
  try { const r = await sb.auth.getSession(); sess = r.data && r.data.session; } catch {}
  if (sess){ definirUsuario(sess.user); await sincronizar(); if (estadoSync === 'ok') semente(); }
  else if (navigator.onLine || !uid) mostrarLogin();
  else { semente(); pintarSync(); }
  sb.auth.onAuthStateChange((ev, s) => { if (s && s.user) definirUsuario(s.user); });
}

function agendarEnvio(){ clearTimeout(tEnvio); tEnvio = setTimeout(() => sincronizar(), 2000); }
function pintarSync(){
  const pend = [...D.secoes.values(), ...D.paginas.values()].some(o => o._p);
  const b = $('#bSync');
  const st = !navigator.onLine || !sb || !uid ? 'off' : estadoSync === 'erro' ? 'erro' : pend ? 'pend' : 'ok';
  b.className = 'sync ' + st;
  const e2 = $('#eSync'); if (e2){ e2.className = b.className; }
  b.title = { off: 'Sem internet — tudo fica guardado no iPad', erro: 'Erro ao sincronizar — toque para tentar de novo', pend: 'Alterações esperando para subir', ok: 'Tudo sincronizado' }[st];
}

async function sincronizar(manual){
  if (!sb || !uid || !navigator.onLine){ pintarSync(); if (manual) aviso(!navigator.onLine ? 'Sem internet agora. Tudo continua guardado no aparelho.' : 'Entre na sua conta para sincronizar.'); if (manual && navigator.onLine && sb && !uid) mostrarLogin(); return; }
  try { const r = await sb.auth.getSession(); if (!(r.data && r.data.session)){ estadoSync = 'erro'; ultimoErro = 'Sem login válido neste aparelho'; pintarSync(); mostrarLogin('Entre de novo para sincronizar.'); return; } } catch {}
  if (sincronizando){ deNovo = true; return; }
  sincronizando = true;
  try {
    gravarTintaAgora();
    let falha = null;
    try { await subirImagens(); } catch (e) { falha = e; }
    try { await enviar(); } catch (e) { falha = falha || e; }
    await receber();
    baixarFaltantes();
    if (falha) throw falha;
    estadoSync = 'ok'; ultimoErro = ''; gravarLS('pg.ultSync', agora());
    if (manual) aviso('Sincronizado ✓');
  } catch (e) {
    estadoSync = 'erro';
    const m = (e && (e.message || e.code)) || String(e);
    ultimoErro = `${new Date().toLocaleTimeString('pt-BR')} · ${(e && e.code) ? e.code + ' · ' : ''}${m}${e && e.details ? ' · ' + e.details : ''}${e && e.hint ? ' · ' + e.hint : ''}`;
    console.error('[Pergaminho] sincronização:', e);
    if (/cd_cadernos|caderno_id/i.test(m + ' ' + (e && e.details))){
      if (!avisouSQL3 || manual){ avisouSQL3 = true; aviso('Para sincronizar os cadernos da estante, rode no Supabase o arquivo caderno-etapa3.sql.', 10000); }
    } else if (/fundo|Bucket not found|bucket|row-level security.*objects|STORAGE/i.test(m + ' ' + (e && e.code) + ' ' + (e && e.details))){
      if (!avisouSQL2 || manual){ avisouSQL2 = true; aviso('Para sincronizar as páginas de PDF, rode no Supabase o arquivo caderno-etapa2.sql. As demais páginas continuam sincronizando.', 10000); }
    } else if (/PGRST205|42P01|does not exist|schema cache/i.test(m + ' ' + (e && e.code))){
      if (!avisouSQL || manual){ avisouSQL = true; aviso('Falta rodar no Supabase o arquivo caderno.sql (tabelas do Pergaminho). Até lá, tudo fica guardado no iPad.', 9000); }
    } else if (/JWT|token|401|403/i.test(m)){ mostrarLogin('Entre de novo para sincronizar.'); }
    else aviso('Não consegui sincronizar: ' + m, manual ? 9000 : 5000);
  } finally {
    sincronizando = false; pintarSync();
    if (deNovo){ deNovo = false; setTimeout(sincronizar, 300); }
  }
}

async function enviar(){
  let erro = null;
  for (const tipo of TIPOS){
    const pend = [...D[tipo].values()].filter(o => o._p);
    for (let i = 0; i < pend.length; i += 15){
      const lote = pend.slice(i, i + 15);
      const linhas = lote.map(o => ({ ...limpo(tipo, o), user_id: uid }));
      // linhas com colunas diferentes (ex.: com e sem "fundo") vão em envios separados
      const grupos = {};
      linhas.forEach(l => (grupos[Object.keys(l).sort().join()] ||= []).push(l));
      for (const g of Object.values(grupos).sort((a, b) => ('fundo' in a[0]) - ('fundo' in b[0]))){
        const { error } = await sb.from(TABELA[tipo]).upsert(g);
        if (error){ erro = erro || error; g.forEach(l => { l._falhou = 1; }); }
      }
      lote.forEach((o, k) => {
        const m = D[tipo].get(o.id);
        if (!linhas[k]._falhou && m && m.atualizado_em === linhas[k].atualizado_em){ delete m._p; IDB.por(tipo, m); }
      });
    }
  }
  if (erro) throw erro;
}

async function receber(){
  let mudou = false, atualMudou = false, falha = null;
  for (const tipo of TIPOS){ try {
    let ult = (await IDB.meta('ult_' + tipo)) || lerLS('pg.ult_' + tipo, '1970-01-01T00:00:00Z');
    for (let volta = 0; volta < 50; volta++){
      const { data, error } = await sb.from(TABELA[tipo]).select('*').gt('servidor_em', ult).order('servidor_em').limit(500);
      if (error) throw error;
      for (const r of data){
        const l = D[tipo].get(r.id);
        if (!l || new Date(r.atualizado_em) > new Date(l.atualizado_em)){
          const o = limpo(tipo, r); D[tipo].set(o.id, o); IDB.por(tipo, o); mudou = true;
          if (tipo === 'paginas' && o.id === atualId) atualMudou = true;
          if (tipo !== 'paginas') atualMudou = true;
        } else if (l && l._p && l.atualizado_em === r.atualizado_em){ delete l._p; IDB.por(tipo, l); }
      }
      if (data.length) ult = data[data.length - 1].servidor_em;
      if (data.length < 500) break;
    }
    await IDB.metaPor('ult_' + tipo, ult); gravarLS('pg.ult_' + tipo, ult);
  } catch (e) { falha = falha || e; } }
  if (mudou) garantirCadernos();
  if (mudou && estanteAberta()) pintarEstante();
  if (mudou){
    const desenhando = ativo !== null || pendenteTinta || (document.activeElement && document.activeElement.classList.contains('tx'));
    if (atualMudou && !desenhando) abrir(atualId);
    else { pintarAbas(); pintarBarra(); if (!P) desenharFundo(); }
  }
  if (falha) throw falha;
}

/* primeira vez: cria uma aba para começar */
function semente(){
  garantirCadernos();
  if (secoesOrd().length) return;
  if (lerLS('pg.semeado', false) && [...D.secoes.values()].length) return;
  gravarLS('pg.semeado', true);
  criarAba('Anotações', PASTEIS[0], false);
  const s = secoesOrd()[0]; const pgs = s ? paginasDe(s.id) : [];
  abrir(pgs.length ? pgs[0].id : 'indice');
}

/* =====================================================================
   INÍCIO
   ===================================================================== */
let precisaMedir = false;
async function iniciar(){
  $('#bIndice').innerHTML = I.indice; $('#bPaginas').innerHTML = I.paginas; $('#bAnt').innerHTML = I.ant; $('#bSeg').innerHTML = I.seg;
  $('#bNova').innerHTML = I.nova + '<span class="rot">Página</span>'; $('#bAjustes').innerHTML = I.ajustes; $('#bApagar').innerHTML = I.lixo;
  $$('[data-versao]').forEach(e => e.textContent = 'v' + VERSAO);
  aplicarTema(); montarFerramentas(); pintarFerramentas();
  $('#bIndice').onclick = () => abrir('indice');
  $('#bEstante').innerHTML = I.estante; $('#bEstante').onclick = mostrarEstante;
  $('#bPaginas').onclick = painelPaginas;
  $('#bAnt').onclick = () => navegar(-1);
  $('#bSeg').onclick = () => navegar(1);
  $('#bNova').onclick = painelNovaPagina;
  $('#bApagar').onclick = e => apagarPaginaAtual(e.currentTarget);
  $('#bSync').onclick = () => sincronizar(true);
  $('#bTema').onclick = () => { gravarLS('pg.tema', lerLS('pg.tema', 'claro') === 'escuro' ? 'claro' : 'escuro'); aplicarTema(); };
  $('#bAjustes').onclick = painelAjustes;

  // dados do aparelho primeiro (abre na hora, mesmo sem internet)
  const [cs, ss, ps] = await Promise.all([IDB.todos('cadernos'), IDB.todos('secoes'), IDB.todos('paginas')]);
  (cs || []).forEach(c => D.cadernos.set(c.id, c));
  (ss || []).forEach(s => D.secoes.set(s.id, s));
  (ps || []).forEach(p => D.paginas.set(p.id, p));
  garantirCadernos();
  abrir(atualId);
  if (lerLS('pg.naEstante', false)) mostrarEstante();
  pintarSync();

  window.addEventListener('resize', () => {
    if (document.activeElement && document.activeElement.classList.contains('tx')){ precisaMedir = true; return; }
    medir();
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => desenharFundo());
  window.addEventListener('online', () => sincronizar());
  window.addEventListener('offline', pintarSync);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden){ gravarTintaAgora(); sincronizar(); }
    else { sincronizar(); verificarVersao(); }
  });
  window.addEventListener('pagehide', gravarTintaAgora);
  setInterval(() => { if (!document.hidden) sincronizar(); }, 20 * 1000);
  window.addEventListener('focus', () => sincronizar());
  window.addEventListener('pageshow', () => sincronizar());
  setTimeout(verificarVersao, 5000);
  setInterval(verificarVersao, 30 * 60 * 1000);

  await iniciarNuvem();
}
iniciar();

if ('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
